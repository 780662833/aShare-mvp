name: tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - run: go mod tidy
      - uses: actions/upload-artifact@v4
        with:
          name: go-module-files
          path: |
            go.mod
            go.sum
          if-no-files-found: error
          retention-days: 1
      - run: go test ./...

  czsc-contract:
    name: CZSC contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run contract tests
        working-directory: czsc-service
        run: python -m unittest discover -s czsc_service -p "test_*.py"
