name: tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      # The initial repository did not contain go.sum. Resolve and write the
      # module checksums before executing the test suite.
      - run: go mod tidy
      - run: go test ./...

  czsc-contract:
    name: CZSC contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run contract tests
        working-directory: czsc-service
        run: python -m unittest discover -s czsc_service -p "test_*.py"
